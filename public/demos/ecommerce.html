<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo · Storefront</title>
<style>
  :root { --accent:#f59e0b; --bg:#0d0c0a; --card:#17150f; --line:#2c2718; --txt:#f4efe3; --mut:#b0a68c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(180deg,#14120c,var(--bg)); color:var(--txt); min-height:100vh; }
  header { position:sticky; top:0; background:rgba(13,12,10,.85); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); z-index:5; }
  .bar { max-width:1000px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .logo { font-weight:800; font-size:18px; } .logo b { color:var(--accent); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; }
  .filters button { background:var(--card); border:1px solid var(--line); color:var(--mut); padding:7px 14px; border-radius:999px; cursor:pointer; font-size:12px; transition:.2s; }
  .filters button.active { background:var(--accent); color:#1a1500; border-color:var(--accent); font-weight:700; }
  .cartbtn { position:relative; background:var(--card); border:1px solid var(--line); color:var(--txt); padding:9px 14px; border-radius:12px; cursor:pointer; font-size:13px; font-weight:600; }
  .cartbtn .count { position:absolute; top:-8px; right:-8px; background:var(--accent); color:#1a1500; border-radius:999px; font-size:11px; font-weight:800; min-width:20px; height:20px; display:grid; place-items:center; padding:0 5px; }
  main { max-width:1000px; margin:0 auto; padding:30px 20px 100px; }
  .hero { text-align:center; padding:34px 16px 26px; } .hero h1 { font-size:34px; } .hero p { color:var(--mut); margin-top:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; transition:.25s; }
  .card:hover { transform:translateY(-5px); border-color:var(--accent); box-shadow:0 18px 40px rgba(0,0,0,.45); }
  .thumb { height:150px; display:grid; place-items:center; font-size:52px; }
  .body { padding:14px; } .cat { font-size:11px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .body h3 { font-size:15px; margin:4px 0; } .price { font-size:17px; font-weight:800; margin-bottom:10px; }
  .add { width:100%; border:0; cursor:pointer; background:var(--accent); color:#1a1500; font-weight:800; padding:10px; border-radius:12px; transition:.2s; }
  .add:hover { filter:brightness(1.08); } .add.added { background:#10b981; color:#04140b; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:320px; max-width:88vw; background:#12100b; border-left:1px solid var(--line); transform:translateX(102%); transition:.3s cubic-bezier(.16,1,.3,1); z-index:20; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); } .drawer header { display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid var(--line); }
  .drawer .items { flex:1; overflow:auto; padding:12px 16px; display:grid; gap:10px; align-content:start; }
  .line { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; font-size:13px; }
  .line .em { font-size:22px; } .line .n { flex:1; } .rm { background:none; border:0; color:#ef4444; cursor:pointer; font-size:16px; }
  .drawer footer { padding:16px; border-top:1px solid var(--line); } .tot { display:flex; justify-content:space-between; font-weight:800; margin-bottom:12px; }
  .checkout { width:100%; border:0; cursor:pointer; background:var(--accent); color:#1a1500; font-weight:800; padding:12px; border-radius:12px; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:.3s; z-index:15; } .scrim.on { opacity:1; pointer-events:auto; }
  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--accent); color:#1a1500; padding:11px 18px; border-radius:12px; font-size:13px; font-weight:800; opacity:0; pointer-events:none; transition:.3s; z-index:30; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .empty { color:var(--mut); font-size:13px; text-align:center; padding:30px 0; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">LUMEN<b>·STORE</b></div>
  <div class="filters" id="filters">
    <button data-c="all" class="active">All</button>
    <button data-c="audio">Audio</button>
    <button data-c="desk">Desk</button>
    <button data-c="light">Light</button>
  </div>
  <button class="cartbtn" onclick="openCart()">🛒 Cart<span class="count" id="count">0</span></button>
</div></header>
<main>
  <div class="hero"><h1>Objects for a calmer desk</h1><p>Minimal hardware, made to last. Free shipping over $80.</p></div>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <header><strong>Your cart</strong><button class="rm" onclick="closeCart()" style="font-size:20px">✕</button></header>
  <div class="items" id="items"></div>
  <footer><div class="tot"><span>Total</span><span id="total">$0</span></div>
    <button class="checkout" onclick="checkout()">Checkout</button></footer>
</aside>
<div id="toast"></div>

<script>
  const PRODUCTS=[
    {id:1,n:'Halo Speaker',c:'audio',p:129,e:'🔊',g:'linear-gradient(135deg,#f59e0b,#b45309)'},
    {id:2,n:'Nimbus Keyboard',c:'desk',p:189,e:'⌨️',g:'linear-gradient(135deg,#8b5cf6,#6d28d9)'},
    {id:3,n:'Glow Desk Lamp',c:'light',p:79,e:'💡',g:'linear-gradient(135deg,#06b6d4,#0e7490)'},
    {id:4,n:'Echo Buds',c:'audio',p:99,e:'🎧',g:'linear-gradient(135deg,#ec4899,#be185d)'},
    {id:5,n:'Slate Deskmat',c:'desk',p:45,e:'🧱',g:'linear-gradient(135deg,#334155,#0f172a)'},
    {id:6,n:'Prism Bar Light',c:'light',p:64,e:'🌈',g:'linear-gradient(135deg,#10b981,#047857)'},
    {id:7,n:'Vinyl Dock',c:'audio',p:149,e:'💿',g:'linear-gradient(135deg,#f43f5e,#9f1239)'},
    {id:8,n:'Orbit Monitor Arm',c:'desk',p:119,e:'🖥️',g:'linear-gradient(135deg,#6366f1,#3730a3)'}
  ];
  let cart=[], filter='all';
  const grid=document.getElementById('grid');
  function render(){
    grid.innerHTML='';
    PRODUCTS.filter(p=>filter==='all'||p.c===filter).forEach(p=>{
      const el=document.createElement('div'); el.className='card';
      el.innerHTML=`<div class="thumb" style="background:${p.g}">${p.e}</div>
        <div class="body"><div class="cat">${p.c}</div><h3>${p.n}</h3><div class="price">$${p.p}</div>
        <button class="add" data-id="${p.id}">Add to cart</button></div>`;
      grid.appendChild(el);
    });
    grid.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(+b.dataset.id,b));
  }
  function add(id,btn){ const p=PRODUCTS.find(x=>x.id===id); cart.push(p); update();
    btn.textContent='Added ✓'; btn.classList.add('added'); setTimeout(()=>{btn.textContent='Add to cart';btn.classList.remove('added');},1100);
    toast(`${p.n} added to cart`); }
  function remove(i){ cart.splice(i,1); update(); }
  function update(){
    document.getElementById('count').textContent=cart.length;
    const items=document.getElementById('items'); items.innerHTML='';
    if(!cart.length){ items.innerHTML='<div class="empty">Your cart is empty.</div>'; }
    cart.forEach((p,i)=>{ const l=document.createElement('div'); l.className='line';
      l.innerHTML=`<span class="em">${p.e}</span><span class="n">${p.n}<br/><small style="color:#b0a68c">$${p.p}</small></span><button class="rm" onclick="remove(${i})">🗑</button>`;
      items.appendChild(l); });
    document.getElementById('total').textContent='$'+cart.reduce((s,p)=>s+p.p,0);
  }
  function openCart(){document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('on');}
  function closeCart(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('on');}
  function checkout(){ if(!cart.length){toast('Add something first 🙂');return;} cart=[]; update(); closeCart(); toast('✅ Order placed (demo — no payment taken)'); }
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{
    filter=b.dataset.c; document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b)); render(); });
  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
  render(); update();
</script>
</body>
</html>
