<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo · AI Chat</title>
<style>
  :root { --accent:#8b5cf6; --bg:#0a0812; --card:#141024; --line:#241d3d; --txt:#ece8ff; --mut:#a49bc4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:radial-gradient(800px 400px at 50% -10%,rgba(139,92,246,.2),transparent),var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; background:rgba(10,8,18,.7); backdrop-filter:blur(8px); }
  .orb { width:38px; height:38px; border-radius:50%; background:conic-gradient(from 0deg,#8b5cf6,#ec4899,#06b6d4,#8b5cf6); animation:spin 6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  header .meta b { font-size:15px; } header .meta div { font-size:12px; color:#10b981; display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:#10b981; box-shadow:0 0 8px #10b981; }
  .clear { margin-left:auto; background:var(--card); border:1px solid var(--line); color:var(--mut); padding:7px 13px; border-radius:10px; cursor:pointer; font-size:12px; }
  .chat { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:78%; padding:12px 15px; border-radius:16px; font-size:14px; line-height:1.55; animation:pop .25s ease; }
  @keyframes pop { from { opacity:0; transform:translateY(8px); } }
  .msg.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .msg.user { align-self:flex-end; background:linear-gradient(135deg,var(--accent),#6d28d9); border-bottom-right-radius:5px; }
  .typing { display:flex; gap:5px; padding:14px 16px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--mut); animation:bounce 1.2s infinite; } .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.4;} 30%{transform:translateY(-6px);opacity:1;} }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 22px 10px; }
  .chips button { background:var(--card); border:1px solid var(--line); color:var(--mut); padding:8px 13px; border-radius:999px; cursor:pointer; font-size:12.5px; transition:.2s; }
  .chips button:hover { color:var(--txt); border-color:var(--accent); transform:translateY(-1px); }
  form { display:flex; gap:10px; padding:14px 20px 20px; border-top:1px solid var(--line); }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt); padding:13px 16px; border-radius:14px; font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button.send { background:var(--accent); border:0; color:#fff; width:48px; border-radius:14px; cursor:pointer; font-size:18px; transition:.2s; }
  button.send:hover { filter:brightness(1.12); transform:translateY(-1px); }
</style>
</head>
<body>
<header>
  <div class="orb"></div>
  <div class="meta"><b>Nova Assistant</b><div><span class="dot"></span>online · demo mode</div></div>
  <button class="clear" onclick="clearChat()">Clear</button>
</header>
<div class="chat" id="chat"></div>
<div class="chips" id="chips"></div>
<form onsubmit="send(event)">
  <input id="input" autocomplete="off" placeholder="Ask Nova anything…" />
  <button class="send" type="submit">➤</button>
</form>
<script>
  const chat=document.getElementById('chat');
  const QUICK=['What can you do?','Write a haiku','Explain WebGPU','Give me a business idea'];
  const REPLIES=[
    {k:['hello','hi','hey'],a:"Hey there! 👋 I'm Nova, a scripted demo assistant. Ask me anything — replies are canned but the UI is fully interactive."},
    {k:['what can you do','help','capab'],a:"I can chat, brainstorm, and demo this interface:\n\n• 💬 Conversational UI\n• ⚡ Simulated streaming\n• 🎨 Dark glassmorphism\n• 📱 Fully responsive\n\nEverything runs locally — no data leaves your browser."},
    {k:['haiku','poem'],a:"Here's one for you:\n\n代码如流水\n Ships at the speed of thought —\n compile, deploy, ship 🚀"},
    {k:['webgpu','gpu','three'],a:"WebGPU is the successor to WebGL, giving web apps modern compute + graphics. It enables real-time path tracing, GPGPU particle sims, and ML inference right in the tab."},
    {k:['business','idea','startup'],a:"Three quick ideas:\n\n1. 🔧 API for design-token syncing\n2. 🧾 Receipt-scan → expense tracker\n3. 🤝 Async standup bot for remote teams\n\nWant me to expand any of these?"},
    {k:['weather'],a:"I'm a demo with no live data feed, so I can't check the weather — but it's always ☀️ inside this iframe!"},
  ];
  const FALLBACK="That's beyond my canned demo replies, but notice the UI: typing indicator, message animations, and auto-scroll all work. Try one of the suggestion chips!";
  function add(role,text){ const d=document.createElement('div'); d.className='msg '+role; d.innerHTML=text.replace(/\n/g,'<br/>'); chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
  function typing(){ const d=document.createElement('div'); d.className='msg bot typing'; d.innerHTML='<i></i><i></i><i></i>'; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }
  function reply(q){ const t=typing(); setTimeout(()=>{ t.remove();
      const found=REPLIES.find(r=>r.k.some(k=>q.toLowerCase().includes(k)));
      add('bot', found?found.a:FALLBACK); }, 700+Math.random()*500); }
  function submit(text){ if(!text.trim())return; add('user',text); document.getElementById('input').value=''; reply(text); }
  function send(e){ e.preventDefault(); submit(document.getElementById('input').value); }
  document.getElementById('chips').innerHTML=QUICK.map(q=>`<button onclick="submit('${q}')">${q}</button>`).join('');
  function clearChat(){ chat.innerHTML=''; boot(); }
  function boot(){ add('bot',"Hi! I'm Nova 👋 This is a fully client-side AI chatbot demo. Ask me something or tap a suggestion below."); }
  boot();
</script>
</body>
</html>
