<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo · Learning Platform</title>
<style>
  :root { --accent:#10b981; --bg:#07100c; --card:#0d1a13; --line:#1b3325; --txt:#e7f7ee; --mut:#8fb8a1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(180deg,#08130d,var(--bg)); color:var(--txt); }
  header { position:sticky; top:0; z-index:5; background:rgba(7,16,12,.8); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .bar { max-width:1020px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .logo { font-weight:800; font-size:17px; } .logo b { color:var(--accent); }
  .search { flex:1; max-width:340px; } .search input { width:100%; background:var(--card); border:1px solid var(--line); color:var(--txt); padding:10px 14px; border-radius:11px; font:inherit; font-size:13px; }
  .search input:focus { outline:none; border-color:var(--accent); }
  .user { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#10b981,#06b6d4); display:grid; place-items:center; font-weight:800; font-size:13px; }
  main { max-width:1020px; margin:0 auto; padding:26px 20px 80px; }
  .prog { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; margin-bottom:26px; display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .ring { position:relative; width:78px; height:78px; } .ring svg { transform:rotate(-90deg); }
  .ring .pct { position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:17px; }
  .prog .info h3 { font-size:17px; } .prog .info p { color:var(--mut); font-size:13px; margin-top:4px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .filters button { background:var(--card); border:1px solid var(--line); color:var(--mut); padding:8px 15px; border-radius:999px; cursor:pointer; font-size:13px; transition:.2s; }
  .filters button.active { background:var(--accent); color:#04140c; border-color:var(--accent); font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:18px; }
  .course { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; transition:.25s; }
  .course:hover { transform:translateY(-5px); border-color:var(--accent); box-shadow:0 18px 40px rgba(0,0,0,.4); }
  .cover { height:130px; display:grid; place-items:center; font-size:44px; position:relative; }
  .lvl { position:absolute; top:12px; left:12px; background:rgba(0,0,0,.45); backdrop-filter:blur(4px); padding:4px 11px; border-radius:999px; font-size:11px; font-weight:700; }
  .cbody { padding:16px; } .cbody .cat { font-size:11px; color:var(--accent); font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
  .cbody h3 { font-size:16px; margin:6px 0 4px; } .meta { font-size:12px; color:var(--mut); display:flex; gap:12px; margin-bottom:12px; }
  .bar2 { height:7px; border-radius:999px; background:var(--line); overflow:hidden; } .bar2 i { display:block; height:100%; background:linear-gradient(90deg,#10b981,#06b6d4); border-radius:999px; transition:.6s; }
  .lessons { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; display:grid; gap:8px; }
  .lesson { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--mut); cursor:pointer; padding:6px 8px; border-radius:9px; transition:.15s; }
  .lesson:hover { background:rgba(16,185,129,.08); color:var(--txt); }
  .check { width:20px; height:20px; border-radius:6px; border:2px solid var(--line); display:grid; place-items:center; font-size:12px; flex-shrink:0; }
  .lesson.done .check { background:var(--accent); border-color:var(--accent); color:#04140c; } .lesson.done { text-decoration:line-through; }
  .empty { text-align:center; color:var(--mut); padding:50px; grid-column:1/-1; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">Learn<b>Loop</b></div>
  <div class="search"><input id="search" placeholder="Search courses…" oninput="render()" /></div>
  <div class="user">SR</div>
</div></header>
<main>
  <div class="prog">
    <div class="ring">
      <svg width="78" height="78"><circle cx="39" cy="39" r="32" fill="none" stroke="#1b3325" stroke-width="9"/>
      <circle id="ringc" cx="39" cy="39" r="32" fill="none" stroke="#10b981" stroke-width="9" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="201" style="transition:.8s"/></svg>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="info"><h3>Welcome back, Sam 👋</h3><p id="progtext">Complete lessons to grow your streak. Keep it up!</p></div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
  const COURSES=[
    {id:1,t:'Intro to WebGPU',c:'Graphics',lv:'Advanced',e:'🎮',g:'linear-gradient(135deg,#10b981,#065f46)',lessons:['Why WebGPU','Device & buffers','First shader','Compute pass']},
    {id:2,t:'React Performance',c:'Frontend',lv:'Intermediate',e:'⚛️',g:'linear-gradient(135deg,#06b6d4,#0e7490)',lessons:['Profiling','Memoization','Code splitting']},
    {id:3,t:'Design Systems 101',c:'Design',lv:'Beginner',e:'🎨',g:'linear-gradient(135deg,#8b5cf6,#5b21b6)',lessons:['Tokens','Components','Documentation']},
    {id:4,t:'SQL for App Devs',c:'Data',lv:'Intermediate',e:'🗄️',g:'linear-gradient(135deg,#f59e0b,#b45309)',lessons:['Joins','Indexes','Query plans','Window functions']},
    {id:5,t:'Motion Design Basics',c:'Design',lv:'Beginner',e:'🎬',g:'linear-gradient(135deg,#ec4899,#9d174d)',lessons:['Easing','Choreography','Tooling']},
    {id:6,t:'Rust Fundamentals',c:'Systems',lv:'Advanced',e:'🦀',g:'linear-gradient(135deg,#334155,#0f172a)',lessons:['Ownership','Borrowing','Traits','Async']}
  ];
  const CATS=['All',...Array.from(new Set(COURSES.map(c=>c.c)))];
  let cat='All';
  // progress state: courseId -> Set(done lesson indices)
  const done={1:new Set([0,1]),2:new Set([0]),4:new Set([0,1,2]),5:new Set([0])};
  function drawFilters(){ document.getElementById('filters').innerHTML=CATS.map(c=>`<button data-c="${c}" class="${c===cat?'active':''}">${c}</button>`).join('');
    document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{ cat=b.dataset.c; drawFilters(); render(); }); }
  function render(){
    const q=(document.getElementById('search').value||'').toLowerCase();
    const list=COURSES.filter(c=>(cat==='All'||c.c===cat)&&(c.t.toLowerCase().includes(q)||c.c.toLowerCase().includes(q)));
    const grid=document.getElementById('grid');
    if(!list.length){ grid.innerHTML='<div class="empty">No courses match your search.</div>'; updateRing(); return; }
    grid.innerHTML=list.map(c=>{
      const d=done[c.id]||new Set(); const pct=Math.round(d.size/c.lessons.length*100);
      return `<div class="course"><div class="cover" style="background:${c.g}"><span class="lvl">${c.lv}</span>${c.e}</div>
        <div class="cbody"><div class="cat">${c.c}</div><h3>${c.t}</h3>
        <div class="meta"><span>${c.lessons.length} lessons</span><span>${pct}% complete</span></div>
        <div class="bar2"><i style="width:${pct}%"></i></div>
        <div class="lessons">${c.lessons.map((l,i)=>`<div class="lesson ${d.has(i)?'done':''}" onclick="toggle(${c.id},${i})"><span class="check">${d.has(i)?'✓':''}</span>${l}</div>`).join('')}</div>
        </div></div>`; }).join('');
    updateRing();
  }
  function toggle(id,i){ const d=done[id]||(done[id]=new Set()); d.has(i)?d.delete(i):d.add(i); render(); }
  function updateRing(){
    let total=0,complete=0; COURSES.forEach(c=>{ total+=c.lessons.length; complete+=(done[c.id]||new Set()).size; });
    const pct=Math.round(complete/total*100); document.getElementById('pct').textContent=pct+'%';
    document.getElementById('ringc').style.strokeDashoffset=201-(201*pct/100);
    document.getElementById('progtext').textContent=`You've completed ${complete} of ${total} lessons across all courses.`;
  }
  drawFilters(); render();
</script>
</body>
</html>
